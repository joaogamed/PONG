<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Pong Deluxe</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:
  radial-gradient(circle at top,#222,#000);
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

canvas{
  border:4px solid white;
  border-radius:12px;
  background:linear-gradient(to bottom,#111,#000);
  box-shadow:
  0 0 25px rgba(255,255,255,0.3),
  0 0 60px rgba(0,255,255,0.15);
}

.controls{
  position:absolute;
  bottom:20px;
  text-align:center;
  font-size:14px;
  opacity:0.8;
}

.menu{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.92);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  z-index:10;
}

.menu h1{
  font-size:80px;
  letter-spacing:4px;
  text-shadow:
  0 0 10px white,
  0 0 30px cyan;
  margin-bottom:10px;
}

.menu p{
  opacity:0.7;
  margin-bottom:20px;
}

.menu button{
  width:300px;
  padding:18px;
  border:none;
  border-radius:14px;
  background:#00ffaa;
  color:black;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  transition:0.25s;
}

.menu button:hover{
  transform:scale(1.05);
  background:white;
  box-shadow:0 0 20px white;
}

</style>
</head>
<body>

<div class="menu" id="menu">

  <h1>PONG</h1>

  <p>Escolha um modo</p>

  <button onclick="startGame('solo')">
    1vCPU
  </button>

  <button onclick="startGame('1v1')">
    1v1
  </button>

</div>

<canvas id="game" width="900" height="500"></canvas>

<div class="controls">
  W / S = Jogador 1 |
  ↑ / ↓ = Jogador 2 |
  ENTER = Reiniciar |
  ESC = Menu
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");

let gameMode = "solo";
let gameOver = false;
let winner = "";

const paddleWidth = 15;
const paddleHeight = 120;
const ballSize = 16;
const maxScore = 5;

const keys = {};

const player1 = {
  x:20,
  y:190,
  width:paddleWidth,
  height:paddleHeight,
  speed:8,
  score:0
};

const player2 = {
  x:865,
  y:190,
  width:paddleWidth,
  height:paddleHeight,
  speed:8,
  score:0
};

const ball = {
  x:450,
  y:250,
  size:ballSize,
  speedX:7,
  speedY:5
};

document.addEventListener("keydown",(e)=>{

  keys[e.key.toLowerCase()] = true;

  // reiniciar
  if(e.key === "Enter" && gameOver){
    resetGame();
  }

  // voltar menu
  if(e.key === "Escape"){

    menu.style.display = "flex";

    gameOver = false;

    player1.score = 0;
    player2.score = 0;

    resetBall();
  }
});

document.addEventListener("keyup",(e)=>{
  keys[e.key.toLowerCase()] = false;
});

function startGame(mode){

  gameMode = mode;

  menu.style.display = "none";

  resetGame();
}

function resetGame(){

  player1.score = 0;
  player2.score = 0;

  player1.y = 190;
  player2.y = 190;

  gameOver = false;
  winner = "";

  resetBall();
}

function resetBall(){

  ball.x = canvas.width / 2;
  ball.y = canvas.height / 2;

  ball.speedX =
  Math.random() > 0.5 ? 7 : -7;

  ball.speedY =
  Math.random() * 8 - 4;
}

function drawRect(x,y,w,h,color){

  ctx.fillStyle = color;

  ctx.fillRect(x,y,w,h);
}

function drawCircle(x,y,size,color){

  ctx.fillStyle = color;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    size,
    0,
    Math.PI * 2
  );

  ctx.closePath();

  ctx.fill();
}

function drawNet(){

  for(let i = 0; i < canvas.height; i += 30){

    drawRect(
      canvas.width / 2 - 2,
      i,
      4,
      18,
      "white"
    );
  }
}

function drawScore(){

  ctx.fillStyle = "white";

  ctx.font = "55px Arial";

  ctx.fillText(
    player1.score,
    canvas.width / 4,
    70
  );

  ctx.fillText(
    player2.score,
    canvas.width * 0.75,
    70
  );
}

function movePlayers(){

  // PLAYER 1
  if(keys["w"] && player1.y > 0){
    player1.y -= player1.speed;
  }

  if(
    keys["s"] &&
    player1.y + player1.height < canvas.height
  ){
    player1.y += player1.speed;
  }

  // IA SUAVIZADA
  if(gameMode === "solo"){

    let center =
    player2.y + player2.height / 2;

    let aiSpeed =
    player2.speed * 1.15;

    // previsão suave
    let targetY =
    ball.y + (ball.speedY * 6);

    // zona morta
    let deadZone = 25;

    if(center < targetY - deadZone){

      player2.y += aiSpeed;
    }

    else if(center > targetY + deadZone){

      player2.y -= aiSpeed;
    }

    // limites
    if(player2.y < 0){
      player2.y = 0;
    }

    if(
      player2.y + player2.height >
      canvas.height
    ){
      player2.y =
      canvas.height - player2.height;
    }

  } else {

    // 1V1
    if(
      keys["arrowup"] &&
      player2.y > 0
    ){
      player2.y -= player2.speed;
    }

    if(
      keys["arrowdown"] &&
      player2.y + player2.height <
      canvas.height
    ){
      player2.y += player2.speed;
    }
  }
}

function collision(ball,paddle){

  return(
    ball.x - ball.size <
    paddle.x + paddle.width &&

    ball.x + ball.size >
    paddle.x &&

    ball.y - ball.size <
    paddle.y + paddle.height &&

    ball.y + ball.size >
    paddle.y
  );
}

function checkWinner(){

  if(player1.score >= maxScore){

    gameOver = true;

    if(gameMode === "solo"){
      winner = "VOCÊ VENCEU!";
    } else {
      winner = "JOGADOR 1 VENCEU!";
    }
  }

  if(player2.score >= maxScore){

    gameOver = true;

    if(gameMode === "solo"){
      winner = "A MÁQUINA VENCEU!";
    } else {
      winner = "JOGADOR 2 VENCEU!";
    }
  }
}

function updateBall(){

  if(gameOver) return;

  ball.x += ball.speedX;
  ball.y += ball.speedY;

  // parede
  if(
    ball.y - ball.size < 0 ||
    ball.y + ball.size > canvas.height
  ){
    ball.speedY *= -1;
  }

  // player 1
  if(collision(ball,player1)){

    ball.speedX *= -1;

    let collidePoint =
    ball.y -
    (player1.y + player1.height / 2);

    collidePoint =
    collidePoint /
    (player1.height / 2);

    ball.speedY =
    collidePoint * 9;
  }

  // player 2
  if(collision(ball,player2)){

    ball.speedX *= -1;

    let collidePoint =
    ball.y -
    (player2.y + player2.height / 2);

    collidePoint =
    collidePoint /
    (player2.height / 2);

    ball.speedY =
    collidePoint * 9;
  }

  // pontuação
  if(ball.x < 0){

    player2.score++;

    checkWinner();

    resetBall();
  }

  if(ball.x > canvas.width){

    player1.score++;

    checkWinner();

    resetBall();
  }
}

function drawGlowBall(){

  ctx.shadowColor = "white";
  ctx.shadowBlur = 25;

  drawCircle(
    ball.x,
    ball.y,
    ball.size,
    "white"
  );

  ctx.shadowBlur = 0;
}

function drawGameOver(){

  ctx.fillStyle =
  "rgba(0,0,0,0.85)";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.textAlign = "center";

  ctx.fillStyle = "white";

  ctx.font = "75px Arial";

  ctx.fillText(
    "FIM DE JOGO",
    canvas.width / 2,
    170
  );

  ctx.fillStyle = "#00ffaa";

  ctx.font = "55px Arial";

  ctx.fillText(
    winner,
    canvas.width / 2,
    280
  );

  ctx.fillStyle = "white";

  ctx.font = "28px Arial";

  ctx.fillText(
    "ENTER = Jogar Novamente",
    canvas.width / 2,
    370
  );

  ctx.fillText(
    "ESC = Voltar ao Menu",
    canvas.width / 2,
    420
  );
}

function render(){

  // fundo
  drawRect(
    0,
    0,
    canvas.width,
    canvas.height,
    "#050505"
  );

  drawNet();

  drawScore();

  // glow player 1
  ctx.shadowColor = "#00ffee";
  ctx.shadowBlur = 15;

  drawRect(
    player1.x,
    player1.y,
    player1.width,
    player1.height,
    "#ffffff"
  );

  // glow player 2
  ctx.shadowColor = "#ff4444";

  drawRect(
    player2.x,
    player2.y,
    player2.width,
    player2.height,
    "#ffffff"
  );

  ctx.shadowBlur = 0;

  drawGlowBall();

  if(gameOver){
    drawGameOver();
  }
}

function gameLoop(){

  movePlayers();

  updateBall();

  render();

  requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
